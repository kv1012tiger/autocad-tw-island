<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>神獸試煉島</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Chakra+Petch:wght@600;700&display=swap" media="print" onload="this.media='all'">
<style>
/* 版面：深海夜色的一欄手機遊戲畫面；上方神獸卡、下方分頁（關卡／碎片／召喚／圖鑑） */
:root{
  --sea:#08202e; --sea2:#0e3346; --panel:#123e55; --line:#2a6683;
  --fg:#eaf6fb; --muted:#9cc3d4; --gold:#ffc94a; --gold2:#ff9f1c;
  --ok:#5ee08a; --bad:#ff6b6b;
  --water:#4fc3f7; --fire:#ff7043; --wood:#66bb6a; --metal:#ffd54f; --earth:#c49a6c;
  --f-body:"Noto Sans TC",system-ui,sans-serif; --f-num:"Chakra Petch","Noto Sans TC",monospace;
  color-scheme:normal;
}
html,body{background:transparent;color:var(--fg);margin:0}
body{font-family:var(--f-body);font-size:15px;line-height:1.55;
  }
.wrap{max-width:640px;margin:0 auto;padding-block:4px 16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
h1{font-size:1.35rem;margin:0;font-weight:900;letter-spacing:.02em;text-wrap:balance}
h2{font-size:1.05rem;margin:0 0 8px;font-weight:900}
.beta{display:inline-block;font-size:.72rem;font-weight:700;color:var(--sea);background:var(--gold);border-radius:99px;padding:1px 8px;margin-left:6px;vertical-align:3px}
.sub{color:var(--muted);font-size:.86rem;margin:2px 0 0}
.box{background:linear-gradient(180deg,var(--panel),var(--sea2));border:1px solid var(--line);border-radius:16px;padding:14px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:10px 16px;cursor:pointer;color:#3a2200;
  background:linear-gradient(180deg,var(--gold),var(--gold2));box-shadow:0 3px 0 #b86a00}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #b86a00}
.btn:disabled{filter:grayscale(1) brightness(.6);cursor:not-allowed;transform:none}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);box-shadow:none}
.btn:focus-visible,.tab:focus-visible,.opt:focus-visible{outline:3px solid #fff;outline-offset:2px}
/* 分頁 */
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;
  background:var(--sea);padding:6px 0}

.tab{font:inherit;font-weight:700;font-size:.88rem;padding:9px 2px;border-radius:12px;border:1px solid var(--line);background:var(--sea2);color:var(--muted);cursor:pointer}
.tab[aria-selected="true"]{background:var(--gold);color:#3a2200;border-color:var(--gold)}
.tab .dot{display:inline-block;min-width:18px;font-size:.72rem;background:var(--bad);color:#fff;border-radius:99px;margin-left:3px}
/* 今日狀態 */
.stat{display:flex;gap:10px;flex-wrap:wrap}
.stat>div{flex:1 1 120px;background:var(--sea);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.stat b{font-size:1.25rem}
.stat small{display:block;color:var(--muted);font-size:.76rem}
/* 碎片（神獸圖切三段：頭＝上、身＝中、腳＝下） */
.part{position:relative;width:52px;height:52px;border-radius:10px;background:var(--sea);border:1px solid var(--line);flex:none;overflow:hidden}
.part .ghost{opacity:.18;filter:grayscale(1)}
.part.head .lit{clip-path:inset(0 0 55% 0)}.part.body .lit{clip-path:inset(28% 0 28% 0)}.part.foot .lit{clip-path:inset(55% 0 0 0)}
.part::after{content:"";position:absolute;left:3px;right:3px;border:2px dashed var(--gold);border-radius:6px;pointer-events:none}
.part.head::after{top:3px;height:22px}.part.body::after{top:15px;height:22px}.part.foot::after{bottom:3px;height:22px}
.part.none .lit{display:none}.part.none::after{border-color:var(--line)}
.prow{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.prow:first-of-type{border-top:0}
.pname{font-weight:900}.pname small{font-weight:400;color:var(--muted);margin-left:4px}
.pcells{display:flex;gap:8px;flex-wrap:wrap}
.pcell{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.74rem;color:var(--muted)}
.pcell b{color:var(--fg)}
.emo{font-size:40px;width:56px;height:56px;display:grid;place-items:center;border-radius:14px;background:var(--sea);border:2px solid var(--line)}
/* 關卡 */
.q{font-size:1.15rem;font-weight:900;margin:6px 0 12px;min-height:3em;text-wrap:balance}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{font:inherit;font-family:var(--f-num);font-size:1.05rem;letter-spacing:.04em;padding:14px 6px;border-radius:12px;border:1px solid var(--line);background:var(--sea);color:var(--fg);cursor:pointer}
.opt.txt{font-family:var(--f-body);font-size:.92rem;letter-spacing:0}
.diffbar{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;background:var(--sea);border:1px solid var(--gold);border-radius:12px;padding:8px 10px;margin:6px 0}
.opt.right{background:#1e5c3a;border-color:var(--ok)}.opt.wrong{background:#5c1e1e;border-color:var(--bad)}
.timer{height:8px;border-radius:99px;background:var(--sea);overflow:hidden;margin:6px 0}
.timer i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),var(--gold),var(--bad));transform-origin:left}
.prog{display:flex;justify-content:space-between;color:var(--muted);font-size:.85rem}
.drop{display:flex;align-items:center;gap:12px;background:var(--sea);border:1px dashed var(--gold);border-radius:14px;padding:12px;margin-top:10px}
/* 召喚 */
.forge{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.fcard{background:var(--sea);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center}
.fcard.ready{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.stack{display:flex;flex-direction:column;gap:2px}
.rate{font-size:.8rem;color:var(--muted)}.rate b{color:var(--gold);font-size:1rem}
.seal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(3,14,20,.86);padding:20px}
.seal-in{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;max-width:340px}
.orb{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;font-size:84px;
  background:radial-gradient(circle at 35% 30%,#fff6,transparent 45%),radial-gradient(circle,var(--c,var(--gold)) 0,transparent 70%)}
.orb.spin{animation:spin 1.6s ease-in-out}
@keyframes spin{0%{transform:scale(.6) rotate(0)}60%{transform:scale(1.15) rotate(540deg)}100%{transform:scale(1) rotate(720deg)}}
.big{font-size:1.4rem;font-weight:900}
/* 神獸卡 */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.bcard{--c:var(--gold);position:relative;border-radius:18px;padding:14px;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 30%,var(--panel)),var(--sea2) 70%);border:2px solid var(--c);display:flex;flex-direction:column;gap:8px}
.bhead{display:flex;gap:12px;align-items:center}
.bhead .emo{border-color:var(--c);font-size:44px}
.stars{color:var(--gold);letter-spacing:2px}
.hp{display:flex;align-items:baseline;gap:6px}.hp b{font-size:1.9rem;color:var(--ok)}
.affl{font-size:.82rem;color:var(--muted);display:flex;flex-direction:column;gap:3px}.hpbar.aff i{background:linear-gradient(90deg,#ff8fb1,#ffc1d6)}
.hpbar{height:10px;border-radius:99px;background:var(--sea);overflow:hidden}.hpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),#b6ff8a)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:.84rem;color:var(--muted)}.kv b{color:var(--fg)}
.formula{font-size:.78rem;color:var(--muted);background:var(--sea);border-radius:10px;padding:6px 8px;overflow-x:auto}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn small{font-weight:400;font-size:.75rem;opacity:.85}
.btn.sm0{padding:6px 12px;font-size:.85rem}
.btn.sm{padding:5px 10px;font-size:.8rem;margin-left:auto}
.clist{display:flex;flex-direction:column;gap:6px;border-top:1px dashed var(--line);padding-top:8px;font-size:.84rem}
.citem{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--sea);border-radius:10px;padding:6px 8px}
.citem .stars{font-size:.78rem;letter-spacing:1px}
.cbtns{display:flex;gap:6px;margin-left:auto}.cbtns .btn.sm{margin-left:0}
.reels{display:flex;gap:8px;justify-content:center;font-size:2.4rem;margin:6px 0 10px}.reels span{width:64px;height:64px;display:grid;place-items:center;background:var(--sea);border:2px solid var(--line);border-radius:14px}
.resline{font-size:.85rem;color:var(--muted);margin-top:6px}
.coll{font-size:.85rem;color:var(--muted)}
.tbl{width:100%;border-collapse:collapse;font-size:.85rem}.tbl td,.tbl th{border-bottom:1px solid var(--line);padding:5px 4px;text-align:left}
.tblw{overflow-x:auto}
.log{font-size:.8rem;color:var(--muted);max-height:150px;overflow:auto;margin:0;padding-left:18px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--gold);color:#3a2200;font-weight:900;padding:10px 18px;border-radius:99px;z-index:30;max-width:90vw;text-align:center}
.empty{color:var(--muted);text-align:center;padding:18px 6px}
/* 神獸圖（取自扭蛋島） */
.bfx{animation:bfx 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes bfx{0%,100%{opacity:.25;transform:translateY(2px) scale(.7)}50%{opacity:1;transform:translateY(-3px) scale(1.1)}}
.wg{transform-box:fill-box;transform-origin:70% 10%;animation:flap .3s ease-in-out infinite alternate}
@keyframes flap{to{transform:scaleY(-.6) rotate(-16deg)}}
.flt{animation:flt 2s ease-in-out infinite alternate}
@keyframes flt{to{transform:translateY(-8px)}}
.part svg,.emo svg,.orb svg{overflow:visible}
.part .ghost,.part .lit{position:absolute;inset:3px}
.part .ghost svg,.part .lit svg{width:100%;height:100%}
.emo svg{width:52px;height:auto}.bhead .emo svg{width:60px}
.orb svg{width:120px;height:auto}
@media (prefers-reduced-motion:reduce){.flt,.bfx{animation:none}}
@media (prefers-reduced-motion:reduce){.orb.spin{animation:none}.timer i{transition:none!important}}

.stat{display:grid!important;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px!important;padding:8px!important}
.stat>div{padding:6px 7px!important;min-width:0}
.stat small{font-size:.68rem;line-height:1.25}
.stat b{font-size:1.1rem!important}
.stat span{font-size:.8rem}
.dot{display:inline-block;min-width:18px;font-size:.72rem;background:var(--bad);color:#fff;border-radius:99px;margin-left:3px}
.prow.ready{background:linear-gradient(90deg,rgba(255,201,74,.16),transparent);border-radius:14px;box-shadow:0 0 0 2px var(--gold) inset;padding-left:8px;padding-right:8px}
.sumgo{margin-top:8px;padding:8px 14px;font-size:.9rem;animation:sumPulse 1.6s ease-in-out infinite}
@keyframes sumPulse{50%{box-shadow:0 3px 0 #b86a00,0 0 16px rgba(255,201,74,.9)}}
@media (prefers-reduced-motion:reduce){.sumgo{animation:none}}
</style></head><body>
<div class="wrap">

  <main id="view"></main>
</div>

/* 每種題型的所有題目（t 題目、a 答案、L＋ai 從哪個清單找錯誤選項、o 固定的錯誤選項） */
function cands(kd){
  function by(list,qi,ai,fmt){return list.map(function(x){return {t:fmt(x[qi]),a:x[ai],L:list,ai:ai}})}
  if(kd==='desc')return by(Q,0,1,function(t){return '「'+t+'」是哪個指令？'});
  if(kd==='alias')return by(AL,0,1,function(t){return '快捷鍵「'+t+'」是哪個指令？'});
  if(kd==='rev')return by(Q,1,0,function(t){return '指令「'+t+'」是做什麼的？'});
  if(kd==='var')return by(VAR,0,1,function(t){return t+'，是哪個系統變數？'});
  if(kd==='fkey')return by(FK,0,1,function(t){return '按 '+t+' 是做什麼？'});
  if(kd==='fkey2')return by(FK,1,0,function(t){return '「'+t+'」是哪個功能鍵？'});
  if(kd==='ctrl')return by(CK,0,1,function(t){return '按 '+t+' 是做什麼？'});
  if(kd==='ctrl2')return by(CK,1,0,function(t){return '「'+t+'」要按什麼？'});
  return BAS.filter(function(x){return kd==='bas'||x[0]===1}).map(function(x){return {t:x[1],a:x[2],o:x[3]}});
}
/* 同一天出過的題目記在這台瀏覽器，盡量不重複（某種題型出完了才會再出現） */
function today(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function seenGet(){try{var o=JSON.parse(localStorage.getItem('trialSeen')||'{}');return o.d===today()?o.k||[]:[]}catch(e){return []}}
function seenAdd(ts){try{localStorage.setItem('trialSeen',JSON.stringify({d:today(),k:seenGet().concat(ts).slice(-800)}))}catch(e){}}
function startGame(){
  if(isFull())return render();
  var d=diff(),Dd=DIFF[d],seen=seenGet(),qs=[],pools={};
  Dd.kinds.forEach(function(k){var all=cands(k),fresh=all.filter(function(c){return seen.indexOf(c.t)<0});pools[k]=sh4(fresh.length>=3?fresh:all)});
  var kinds=sh4(Dd.kinds),guard=0;
  while(qs.length<8&&guard++<300){
    var c=pools[kinds[guard%kinds.length]].shift();if(!c)continue;
    if(qs.some(function(x){return x.t===c.t||x.a===c.a}))continue;   /* 同一回不出同一個答案 */
    var w=c.o?c.o.slice():sh4(c.L.map(function(x){return x[c.ai]}).filter(function(v,i,arr){return v!==c.a&&arr.indexOf(v)===i})).slice(0,3);
    qs.push({t:c.t,a:c.a,o:sh4(w.concat([c.a]))});
  }
  seenAdd(qs.map(function(x){return x.t}));
  game={qs:qs,i:0,right:0,done:false,lock:false,d:d,sec:Dd.sec,id:nid()};drawQ();
}
function drawQ(){
  var q=game.qs[game.i];
  $('view').innerHTML='<section class="box"><div class="prog"><span>難度 '+game.d+'・第 <b>'+(game.i+1)+'</b> / 8 題</span><span>答對 <b>'+game.right+'</b></span></div>'+
   '<div class="timer"><i id="tb"></i></div><div class="q">'+esc(q.t)+'</div><div class="opts">'+
   q.o.map(function(o,j){return '<button class="opt'+(/[^\x00-\x7f]/.test(o)?' txt':'')+'" type="button" data-a="'+esc(o)+'">'+esc(o)+'</button>'}).join('')+'</div></section>';
  document.querySelectorAll('.opt').forEach(function(b){b.onclick=function(){answer(b.dataset.a)}});
  var tb=$('tb');tb.style.transition='none';tb.style.transform='scaleX(1)';tb.offsetWidth;tb.style.transition='transform '+game.sec+'s linear';tb.style.transform='scaleX(0)';
  clearTimeout(timer);timer=setTimeout(function(){answer(null)},game.sec*1000);game.lock=false;report();
}
function answer(a){
  if(!game||game.lock)return;game.lock=true;clearTimeout(timer);
  var q=game.qs[game.i];if(a===q.a)game.right++;
  document.querySelectorAll('.opt').forEach(function(b){if(b.dataset.a===q.a)b.classList.add('right');else if(b.dataset.a===a)b.classList.add('wrong');b.disabled=true});
  setTimeout(function(){game.i++;if(game.i<8)drawQ();else finish()},a===q.a?450:1000);
}
function finish(n){
  n=n||0;game.done=true;game.err='';game.retry=n;D.busy=true;render();
  api({a:'trial',id:game.id,right:game.right}).then(function(j){
    /* 同一個 id 重送只會拿回原本的結果、不會重複給獎勵，所以失敗可以放心自動重送 */
    if(!j.ok&&j.net&&n<2){setTimeout(function(){finish(n+1)},1500*(n+1));return}
    if(!j.ok&&j.err==='gamecool'&&n<4){setTimeout(function(){finish(n+1)},5000);return}
    D.busy=false;
    if(!j.ok){game.err=j.err==='gamecool'?'太快了，休息幾秒再送一次':errMsg(j)}
    else{game.res=j.trial;if(j.trial.shard&&ready(j.trial.shard.k))setTimeout(function(){readyPop(j.trial.shard.k)},400);if(j.trial.shard)toast('🧩 獲得 '+BK[j.trial.shard.k].n+' 的「'+PN[j.trial.shard.p]+'」碎片！');else if(j.trial.fruit)toast('🍑 獲得神獸果 ×'+j.trial.fruit)}
    render();if($('retry'))$('retry').onclick=function(){finish(0)};
  });
}

  $('view').innerHTML='<section class="box"><h2>📖 我的神獸</h2><p class="sub">每種神獸只有一隻住小島（預設 IV 最高的），其他放收藏，可以換上小島，或換成資源（IV 愈高換愈多）。🍑 神獸果：<b>'+(b0.fr||0)+'</b> 顆，每隻每天最多餵 '+feedMax+' 顆。</p>'+
   (own.length?'<div class="cards">'+own.map(function(b){var x=beasts()[b.k],lv=x.lv||1,h=hp(b,x.iv||0,lv),st=stars(x.iv||0),aff=x.aff||0,fed=x.bfn||0,cl=coll(b.k);
    return '<article class="bcard" style="--c:'+b.c+'"><div class="bhead"><div class="emo">'+art(b.k,2)+'</div><div><b class="big">'+b.n+'</b><div class="stars">'+starHTML(st)+'</div></div></div>'+
    '<div class="hp"><span>HP</span><b>'+h+'</b><span class="sub">最高 '+hp(b,31,10)+'</span></div><div class="hpbar"><i style="width:'+Math.round(h/maxHp*100)+'%"></i></div>'+
    '<div class="kv"><span>屬性</span><b>'+b.el+'</b><span>等級</span><b>Lv '+lv+' / 10</b><span>個體值 IV</span><b>'+(x.iv||0)+' / 31</b><span>基礎 HP</span><b>'+b.base+'</b></div>'+
    '<div class="affl"><span>親密度 <b>'+aff+'</b>'+(lv<10?'（下一級還差 '+(10-aff%10)+'）':'（已滿級）')+'</span><div class="hpbar aff"><i style="width:'+(lv>=10?100:(aff%10)*10)+'%"></i></div></div>'+
    '<div class="row"><button class="btn" type="button" data-feed="'+esc(x.id)+'"'+(lv>=10||!b0.fr||fed>=feedMax||D.busy?' disabled':'')+'>🍑 餵神獸果 '+fed+'/'+feedMax+'</button></div>'+
    (cl.length?'<div class="clist"><b>🗃 收藏中（'+cl.length+' 隻）</b>'+cl.map(function(c,i){var cs=stars(c.iv),g=sell.wood+c.iv*sellIv;return '<div class="citem"><span class="stars">'+starHTML(cs)+'</span><span>IV '+c.iv+'・HP '+hp(b,c.iv,1+Math.min(9,Math.floor((c.aff||0)/10)))+'</span><span class="cbtns"><button class="btn ghost sm" type="button" data-sw="'+b.k+'" data-i="'+i+'">換上小島</button><button class="btn ghost sm" type="button" data-sell="'+b.k+'" data-i="'+i+'" title="換成 🪵'+g+' 🪨'+g+' 🔩'+g+' 💎'+sell.dia+'">🏪 換 🪵🪨🔩'+g+'</button></span></div>'}).join('')+'</div>':'')+
    '</article>'}).join('')+'</div>'
   :'<div class="empty">還沒有神獸。<br>到「⚔️ 關卡」拿碎片召喚，或到扭蛋島試試手氣。</div>')+
   '<h2 style="margin-top:14px">各神獸 HP 範圍</h2><div class="tblw"><table class="tbl"><tr><th>神獸</th><th>Lv1 IV0</th><th>Lv1 IV31</th><th>Lv10 IV0</th><th>Lv10 IV31</th></tr>'+
   B.map(function(b){return '<tr><td>'+b.e+' '+b.n+'</td><td>'+hp(b,0,1)+'</td><td>'+hp(b,31,1)+'</td><td>'+hp(b,0,10)+'</td><td>'+hp(b,31,10)+'</td></tr>'}).join('')+'</table></div>'+
   '<p class="sub">HP = 基礎 HP ×（1 + IV÷31×0.5）×（1 +（Lv−1）×0.15）。親密度每 10 點升一級：小島上摸摸、餵食都會加，神獸果一顆 +5。</p></section>';
  function act(q,ok){if(D.busy)return;D.busy=true;render();api(q).then(function(j){D.busy=false;if(!j.ok)toast('⚠️ '+errMsg(j));else if(ok)toast(ok(j));render()})}
  document.querySelectorAll('[data-feed]').forEach(function(x){x.onclick=function(){act({a:'bfeed',id:x.dataset.feed},function(j){return '💕 親密度 +5'+(j.bfed?'・Lv '+j.bfed.lv:'')})}});
  document.querySelectorAll('[data-sw]').forEach(function(x){x.onclick=function(){act({a:'bswap',k:x.dataset.sw,i:+x.dataset.i},function(){return '已換上小島'})}});
  document.querySelectorAll('[data-sell]').forEach(function(x){x.onclick=function(){
    if(x.dataset.arm!=='1'){x.dataset.arm='1';x.textContent='確定換？';setTimeout(function(){if(x.isConnected)render()},3000);return}
    act({a:'bsell',k:x.dataset.sell,i:+x.dataset.i},function(j){var g=j.sold.got;return '🏪 換到 🪵'+g.wood+' 🪨'+g.stone+' 🔩'+g.iron+' 💎'+g.dia})}});
}

document.querySelectorAll('.tab').forEach(function(t){t.onclick=function(){if(game&&!game.done&&t.dataset.v!=='play'){clearTimeout(timer);game=null}view=t.dataset.v;render()}});
window.trialSync=function(){load()};
addEventListener('resize',report);
load();

})();
</script>
