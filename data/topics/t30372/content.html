<p>原文：<a href="https://www.autocad-tw.com/t30372-topic" target="_blank" rel="noopener">自動陣列圖塊程式</a></p><p>以前要排圖塊：先算距離，再算數量，然後一顆一顆放。放錯位置？重來。間距不對？重做。矩形邊框慢慢補，到最後眼睛都花了。</p><p>現在 AutoCAD 外掛可以幫你排：</p><ul><li><b>AAN</b>：你說要放幾顆，它自己平均。</li><li><b>AAD</b>：你說間距，它自己算數量。</li><li><b>AAXY</b>：你只要放四個角，剩下全部補滿。</li></ul><iframe src="https://www.youtube.com/embed/XqSwkqXEUws" title="每次陣列都算錯 圖塊數目原來能自動陣列" allowfullscreen loading="lazy"></iframe><iframe src="https://www.youtube.com/embed/XgHCSo-N_eA" title="圖塊等分排不準 用 AAD 一次搞定" allowfullscreen loading="lazy"></iframe><iframe src="https://www.youtube.com/embed/sY6nlSfSxhE" title="兩個方向圖塊排列 AAXY 一指搞定" allowfullscreen loading="lazy"></iframe><p>程式請放置於 D:\LISP程式，使用 APPLOAD 載入。</p><h3>👇程式掛入方式</h3><iframe src="https://www.youtube.com/embed/m7V7wKh-Avo" title="APPLOAD 指令" allowfullscreen loading="lazy"></iframe><div class="dl-box"><div class="section-title">📎 附件下載</div><p>若無下載權限，請確認登入會員 Gmail；若尚未加入論壇專屬 B會員，請透過 <a href="https://lin.ee/4xw8yKI" target="_blank" rel="noopener">官方 LINE</a> 聯繫我們。</p><a class="dl-item" href="https://drive.google.com/file/d/1SXOIRU-5pHYfRSZyYIcbdj5m9UoFJvhk/view?usp=drivesdk" target="_blank" rel="noopener"><span class="dl-n">自動陣列圖塊程式.zip</span><span class="dl-go">⬇️ 下載</span></a></div>
