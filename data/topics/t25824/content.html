<p>原文：<a href="https://www.autocad-tw.com/t25824-topic" target="_blank" rel="noopener">AutoCAD特殊填充線圖案PAT檔</a></p><p>自由填充圖案要下載這些免費的 AutoCAD 填充圖案，只需右鍵單擊所需的圖案並選擇將鏈接另存為，然後將 PAT 文件放置在 AutoCAD 支持路徑中包含的路徑中。請注意該網站有使用規則您可以將這些圖案放置在您的系統上並在您的繪圖中使用它們。您不得以 PAT 形式分發這些模式，而是將相關人員推薦至此頁面。您不得將它們發佈到網上（包括網站、ftp 站點、公告板和其他在線服務）以供公眾下載。👇特殊填充線圖案PAT檔👇</p><p>這篇沒有附件檔，完整內容請看論壇原文。</p>
