<p>原文：<a href="https://www.autocad-tw.com/t30371-topic" target="_blank" rel="noopener">自動陣列圖塊程式</a></p><iframe src="https://www.youtube.com/embed/XqSwkqXEUws" title="每次陣列都算錯 圖塊數目原來能自動陣列" allowfullscreen loading="lazy"></iframe><iframe src="https://www.youtube.com/embed/XgHCSo-N_eA" title="圖塊等分排不準 用 AAD 一次搞定" allowfullscreen loading="lazy"></iframe><iframe src="https://www.youtube.com/embed/sY6nlSfSxhE" title="兩個方向圖塊排列 AAXY 一指搞定" allowfullscreen loading="lazy"></iframe><p>以前要排圖塊：先算距離，再算數量，然後一顆一顆放。現在 AutoCAD 外掛可以幫你排：</p><p>AAN：你說要放幾顆，它自己平均。</p><p>AAD：你說間距，它自己算數量。</p><p>AAXY：你只要放四個角，剩下全部補滿。</p><p>ACADAdviser 程式放置於 C:\AutoCAD Adviser；ATStruCAD 程式放置於 C:\ATStruCAD\ZLISP，使用 APPLOAD 加入啟動套件。</p><h3>👇程式掛入方式</h3><iframe src="https://www.youtube.com/embed/m7V7wKh-Avo" title="APPLOAD 指令" allowfullscreen loading="lazy"></iframe><div class="dl-box"><div class="section-title">📎 附件下載</div><p>若無下載權限，請確認登入會員 Gmail；若尚未加入論壇贊助 A會員，請透過 <a href="https://lin.ee/4xw8yKI" target="_blank" rel="noopener">官方 LINE</a> 聯繫我們。</p><a class="dl-item" href="https://drive.google.com/file/d/1LzyPV1of2HWFWAvg5Zv8Fp0vg9yhPM9D/view?usp=drivesdk" target="_blank" rel="noopener"><span class="dl-n">自動陣列圖塊程式.zip</span><span class="dl-go">⬇️ 下載</span></a></div>
